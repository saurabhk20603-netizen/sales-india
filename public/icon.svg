<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#fed7aa" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Shopping Bag Outline -->
  <path d="M156 180 C 156 124, 356 124, 356 180" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Bag Body -->
  <path d="M120 180 L 392 180 L 360 410 C 356 426, 342 438, 326 438 L 186 438 C 170 438, 156 426, 152 410 Z" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Express Fast Lightning Bolt -->
  <path d="M276 200 L 220 290 L 268 290 L 236 390 L 312 280 L 264 280 Z" fill="#ea580c"/>
  
  <!-- Text Brand "SI" -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="2">SALES INDIA</text>
</svg>
